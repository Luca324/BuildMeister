events {
    worker_connections 1024;
}

http {
    # Логирование
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Основные настройки
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20M;

    upstream grafana {
        server grafana:3000;
    }

    # Upstream для Node.js приложения
    upstream evershop {
        server app:80 max_fails=3 fail_timeout=30s;
        # Резервный сервер не нужен - используем error_page вместо этого
    }

    # Map для условной установки Connection заголовка (WebSocket поддержка)
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Редирект HTTP на HTTPS
    server {
        listen 80;
        server_name buildmeister.no www.buildmeister.no;

        # Для Let's Encrypt проверки (если используете certbot)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Grafana по пути /grafana/
        location ^~ /grafana/ {
            proxy_pass http://grafana/;
            proxy_http_version 1.1;
            
            # Корректировка редиректов от Grafana (все возможные варианты)
            proxy_redirect / /grafana/;
            proxy_redirect http://$host/ http://$host/grafana/;
            proxy_redirect https://$host/ https://$host/grafana/;
            
            # Замена путей в HTML для статических файлов
            sub_filter 'href="/' 'href="/grafana/';
            sub_filter 'src="/' 'src="/grafana/';
            sub_filter 'url("/' 'url("/grafana/';
            sub_filter_once off;
            sub_filter_types text/html text/css text/javascript application/javascript;
            
            # WebSocket поддержка (нужна для Grafana)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            
            # Стандартные заголовки
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            
            # Важно: передаем информацию о подпути в Grafana
            proxy_set_header X-Forwarded-Prefix /grafana;
            
            # Таймауты
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            # Включаем буферизацию для sub_filter
            proxy_buffering on;
        }

        # Редирект всех остальных запросов на HTTPS
        location / {
            return 301 https://$server_name$request_uri;
        }
    }

    # HTTPS сервер
    server {
        listen 443 ssl;
        http2 on;
        server_name buildmeister.no www.buildmeister.no;

        # Пути к SSL сертификатам из папки secrets
        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;

        # SSL настройки безопасности
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Заголовки безопасности
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # Страница технического обслуживания
        location = /maintenance.html {
            root /usr/share/nginx/html;
            internal;
        }
        
        # Статические файлы Grafana (проксируем /public/ напрямую в Grafana)
        location ^~ /public/ {
            proxy_pass http://grafana/public/;
            proxy_http_version 1.1;
            
            # Стандартные заголовки
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            
            # Кэширование статических файлов
            proxy_cache_valid 200 1d;
            expires 1d;
            add_header Cache-Control "public, immutable";
        }
        
        # API Grafana (только если это не основной API приложения)
        # Проверяем, что это не /api/ или /graphql от основного приложения
        location ~ ^/api/(datasources|dashboards|org|user|auth|plugins|search|annotations|alerts|alerting|teams|folders|snapshots|admin|ldap|settings|frontend|live|public) {
            proxy_pass http://grafana;
            proxy_http_version 1.1;
            
            # WebSocket поддержка
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            
            # Стандартные заголовки
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            
            # Отключаем буферизацию для API
            proxy_buffering off;
        }
        
        # Grafana по пути /grafana/
        location ^~ /grafana/ {
            proxy_pass http://grafana/;
            proxy_http_version 1.1;
            
            # Корректировка редиректов от Grafana (все возможные варианты)
            proxy_redirect / /grafana/;
            proxy_redirect http://$host/ http://$host/grafana/;
            proxy_redirect https://$host/ https://$host/grafana/;
            
            # Замена путей в HTML для статических файлов
            sub_filter 'href="/' 'href="/grafana/';
            sub_filter 'src="/' 'src="/grafana/';
            sub_filter 'url("/' 'url("/grafana/';
            sub_filter_once off;
            sub_filter_types text/html text/css text/javascript application/javascript;
            
            # WebSocket поддержка (нужна для Grafana)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            
            # Стандартные заголовки
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            
            # Важно: передаем информацию о подпути в Grafana
            proxy_set_header X-Forwarded-Prefix /grafana;
            
            # Таймауты
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            # Включаем буферизацию для sub_filter
            proxy_buffering on;
        }

        # API запросы (GraphQL, REST) - без буферизации для быстрого ответа
        location ~ ^/(api|graphql) {
            proxy_pass http://evershop;
            proxy_http_version 1.1;
            
            # Быстрые таймауты для определения недоступности
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
            proxy_send_timeout 10s;
            
            # Заглушка при ошибках подключения к upstream (502, 503, 504)
            proxy_intercept_errors on;
            error_page 502 503 504 =503 /maintenance.html;
            
            # Обработка ошибок подключения
            proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
            proxy_next_upstream_tries 1;
            proxy_next_upstream_timeout 5s;
            
            # Условная установка заголовков для WebSocket (только если Upgrade присутствует)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            
            # Стандартные заголовки
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            
            # Передаем все важные заголовки
            proxy_pass_request_headers on;
            
            # Отключаем буферизацию для API - ответы должны идти сразу
            proxy_buffering off;
            proxy_request_buffering off;
            
            # Отключаем кэширование
            proxy_cache_bypass 1;
            proxy_no_cache 1;
        }

        # Проксирование на Node.js приложение (остальные запросы)
        location / {
            proxy_pass http://evershop;
            proxy_http_version 1.1;
            
            # Быстрые таймауты для определения недоступности
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
            proxy_send_timeout 10s;
            
            # Заглушка при ошибках подключения к upstream (502, 503, 504)
            proxy_intercept_errors on;
            error_page 502 503 504 =503 /maintenance.html;
            
            # Обработка ошибок подключения
            proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
            proxy_next_upstream_tries 1;
            proxy_next_upstream_timeout 5s;
            
            # Условная установка заголовков для WebSocket (только если Upgrade присутствует)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            
            # Стандартные заголовки
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            
            # Передаем все важные заголовки
            proxy_pass_request_headers on;
            
            # Буферизация для статических страниц
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_busy_buffers_size 8k;
            
            # Отключаем кэширование для динамических запросов
            proxy_cache_bypass $http_upgrade;
            proxy_no_cache $http_upgrade;
        }

        # Статические файлы (опционально, можно отдавать напрямую через nginx)
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
            proxy_pass http://evershop;
            proxy_http_version 1.1;
            
            # Быстрые таймауты для определения недоступности
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
            proxy_send_timeout 10s;
            
            # Заглушка при ошибках подключения к upstream
            proxy_intercept_errors on;
            error_page 502 503 504 =503 /maintenance.html;
            
            # Обработка ошибок подключения
            proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
            proxy_next_upstream_tries 1;
            proxy_next_upstream_timeout 5s;
            
            # Кэширование статических файлов
            proxy_cache_valid 200 1d;
            expires 1d;
            add_header Cache-Control "public, immutable";
        }
    }
}