            
            # Отключаем кэширование для динамических запросов
            proxy_cache_bypass $http_upgrade;
            proxy_no_cache $http_upgrade;
        }

        # Статические файлы (опционально, можно отдавать напрямую через nginx)
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
            proxy_pass http://evershop;
            proxy_http_version 1.1;
            
            # Быстрые таймауты для определения недоступности
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
            proxy_send_timeout 10s;
            
            # Заглушка при ошибках подключения к upstream
            proxy_intercept_errors on;
            error_page 502 503 504 =503 /maintenance.html;
            
            # Обработка ошибок подключения
            proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
            proxy_next_upstream_tries 1;
            proxy_next_upstream_timeout 5s;
            
            # Кэширование статических файлов
            proxy_cache_valid 200 1d;
            expires 1d;
            add_header Cache-Control "public, immutable";
        }
    }
}