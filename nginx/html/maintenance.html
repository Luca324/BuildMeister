<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buildmeister - Vedlikehold</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            padding: 20px;
        }
        
        .maintenance-container {
            max-width: 600px;
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 60px 40px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .logo {
            font-size: 42px;
            font-weight: 700;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }
        
        .logo span {
            color: #ffd700;
        }
        
        h1 {
            font-size: 36px;
            margin-bottom: 20px;
            font-weight: 600;
        }
        
        .status-badge {
            display: inline-block;
            background: rgba(255, 215, 0, 0.2);
            color: #ffd700;
            padding: 8px 20px;
            border-radius: 50px;
            font-weight: 600;
            margin-bottom: 30px;
            border: 2px solid rgba(255, 215, 0, 0.3);
        }
        
        .message {
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 30px;
            opacity: 0.9;
        }
        
        .contact-info {
            background: rgba(255, 255, 255, 0.1);
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 30px;
        }
        
        .contact-info h3 {
            font-size: 20px;
            margin-bottom: 15px;
            color: #ffd700;
        }
        
        .contact-info p {
            margin-bottom: 10px;
            font-size: 16px;
        }
        
        .progress-container {
            margin: 30px 0;
        }
        
        .progress-bar {
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 15px;
        }
        
        .progress {
            height: 100%;
            background: #ffd700;
            width: 65%;
            animation: pulse 2s infinite;
        }
        
        .time-estimate {
            font-size: 14px;
            opacity: 0.8;
        }
        
        .social-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }
        
        .social-link {
            color: #fff;
            text-decoration: none;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50px;
            transition: all 0.3s ease;
        }
        
        .social-link:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }
        
        .footer {
            margin-top: 40px;
            font-size: 14px;
            opacity: 0.7;
        }
        
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.7; }
            100% { opacity: 1; }
        }
        
        @media (max-width: 768px) {
            .maintenance-container {
                padding: 40px 20px;
            }
            
            .logo {
                font-size: 32px;
            }
            
            h1 {
                font-size: 28px;
            }
            
            .social-links {
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
</head>
<body>
    <div class="maintenance-container">
        <div class="logo">Build<span>Meister</span></div>
        
        <div class="status-badge">MIDLERTIDIG STENGT</div>
        
        <h1>Vi er under vedlikehold</h1>
        
        <div class="message">
            Vi oppgraderer våre systemer for å gi deg en enda bedre opplevelse. 
            Vi beklager ulempene dette måtte medføre og takker for din tålmodighet.
        </div>
        
        <div class="progress-container">
            <div class="progress-bar">
                <div class="progress"></div>
            </div>
            <div class="time-estimate">Estimert gjenåpning: 1-2 timer</div>
        </div>
                
        <div class="footer">
            © 2026 Buildmeister. Alle rettigheter forbeholdt.
        </div>
    </div>
</body>
</html>
