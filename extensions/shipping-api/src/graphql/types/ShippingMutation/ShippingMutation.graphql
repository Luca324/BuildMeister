# Расширяем тип Mutation мутациями доставки
extend type Mutation {
  """
  Расчет стоимости доставки от всех активных провайдеров
  """
  calculateShipping(cartId: ID!): [ShippingProviderOptions!]!
  
  """
  Обновление метода доставки в корзине
  """
  updateCartShippingMethod(cartId: ID!, shippingMethod: JSON!): UpdateCartShippingMethodPayload!
}

type UpdateCartShippingMethodPayload {
  cart: Cart
}
