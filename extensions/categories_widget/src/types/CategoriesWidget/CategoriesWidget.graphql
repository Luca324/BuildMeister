"""
GraphQL схема для виджета категорий

Этот файл определяет кастомный GraphQL тип для виджета.
Evershop автоматически найдет и загрузит этот файл при загрузке расширения.

Зачем нужен кастомный GraphQL тип?
- Виджет получает настройки из БД через getWidgetSetting()
- Настройки могут быть в разных форматах (массив, строка)
- Resolver нормализует данные перед использованием
- Это позволяет обработать настройки перед основным запросом

Когда НЕ нужен кастомный GraphQL тип?
- Если виджет использует только стандартные запросы Evershop (products, categories, collection)
- Если настройки виджета не требуют предварительной обработки

См. также: CategoriesWidget.resolvers.ts - реализация resolver
"""
type CategoriesWidget {
  categories: [String]
}

extend type Query {
  categoriesWidget(settings: JSON): CategoriesWidget
}

