"""
GraphQL схема для получения настроек виджета категорий в компоненте настроек

Этот тип нужен только для компонента настроек, чтобы получить текущие настройки виджета.
Просто возвращает настройки из БД без обработки.
"""
type CategoriesWidget {
  categories: [String]
}

extend type Query {
  categoriesWidget(settings: JSON): CategoriesWidget
}

