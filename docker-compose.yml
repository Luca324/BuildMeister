services:
  # Nginx reverse proxy для SSL
  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./secrets:/etc/nginx/ssl:ro  # SSL сертификаты из папки secrets
      - nginx_logs:/var/log/nginx
    depends_on:
      - app
    networks:
      - myevershop

  app:
    build: 
      context: .  # путь к папке с Dockerfile
      dockerfile: Dockerfile
    restart: always
    command: ["/bin/sh", "./scripts/entrypoint.sh"]
    environment:
      DB_HOST: database
      DB_PORT: 5432
      DB_PASSWORD: postgres
      DB_USER: postgres
      DB_NAME: postgres
      PORT: 80
    networks:
      - myevershop
    depends_on:
      - database
    # Убираем проброс порта наружу - теперь доступ только через nginx
    expose:
      - "80"
    volumes:
      - ./data-export:/app/data-export:rw # чтобы изменения в этой папке отображались в контейнере без пересборки
      - ./config:/app/config:rw 
      - ./scripts:/app/scripts:rw 
      - ./backups:/app/backups:ro # Монтируем папку с дампами для автоматического восстановления
      # - ./extensions:/app/extensions:rw 
      # - ./extensions:/app/scripts/migrate.sh:rw 
  
  #The postgres database: 
  database:
    image: postgres:16
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
    ports:
      - "5434:5432"
    networks:
      - myevershop

networks:
  myevershop:
    name: MyEverShop
    driver: bridge

volumes:
  postgres-data:
  nginx_logs:
