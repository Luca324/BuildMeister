services:
  # Nginx reverse proxy для SSL
  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro  # SSL сертификаты 
      - ./nginx/html:/usr/share/nginx/html:ro  # Страница технического обслуживания
      - nginx_logs:/var/log/nginx
    depends_on:
      - app
    networks:
      - myevershop

  app:
    build: 
      context: .  # путь к папке с Dockerfile
      dockerfile: Dockerfile
    restart: always
    command: ["/bin/sh", "./scripts/entrypoint.sh"]
    environment:
      DB_HOST: ${DB_HOST:?ERROR DB_HOST не определена в .env файле}
      DB_PORT: ${DB_PORT:?ERROR DB_PORT не определена в .env файле}
      DB_PASSWORD: ${DB_PASSWORD:?ERROR DB_PASSWORD не определена в .env файле}
      DB_USER: ${DB_USER:?ERROR DB_USER не определена в .env файле}
      DB_NAME: ${DB_NAME:?ERROR DB_NAME не определена в .env файле}
      PORT: ${PORT:?ERROR PORT не определена в .env файле}
    networks:
      - myevershop
    depends_on:
      - database
    # Убираем проброс порта наружу - теперь доступ только через nginx
    expose:
      - "80"
    volumes:
      - ./data-export:/app/data-export:rw # чтобы изменения в этой папке отображались в контейнере без пересборки
      - ./config:/app/config:rw 
      - ./scripts:/app/scripts:rw 
      - ./backups:/app/backups:rw # Монтируем папку с дампами для автоматического восстановления
  
  #The postgres database: 
  database:
    image: postgres:16
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:?ERROR DB_PASSWORD не определена в .env файле}
      POSTGRES_USER: ${DB_USER:?ERROR DB_USER не определена в .env файле}
      POSTGRES_DB: ${DB_NAME:?ERROR DB_NAME не определена в .env файле}
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    networks:
      - myevershop
    # ВАЖНО: Порт НЕ пробрасывается наружу для безопасности!
    # База доступна только внутри Docker сети

networks:
  myevershop:
    name: MyEverShop
    driver: bridge

volumes:
  postgres-data:
  nginx_logs:
