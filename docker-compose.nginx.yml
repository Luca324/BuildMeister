services:
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    restart: always
    network_mode: host
    # При использовании network_mode: host порты не пробрасываются
    # nginx напрямую слушает на портах 80 и 443 хоста
    volumes:
      # Монтируем SSL сертификаты (на случай если нужно обновлять без пересборки)
      - ./nginx/ssl/fullchain.pem:/etc/nginx/ssl/fullchain.pem:ro
      - ./nginx/ssl/key.pem:/etc/nginx/ssl/key.pem:ro
      # Монтируем конфигурацию (для удобства редактирования)
      - ./nginx/ssl/nginx.conf:/etc/nginx/nginx.conf:ro

